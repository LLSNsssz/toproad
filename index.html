<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탑로드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* Layout: one portrait play frame centred on a dark field; HUD and sheets float over the canvas */
:root{
  --field:#15130f;
  --ink:#1c1a16;
  --paper:#fbf3e2;
  --paper-2:#efe1c3;
  --muted:#857659;
  --hazard:#ffc21a;
  --hazard-deep:#b98a00;
  --cobalt:#2d63f0;
  --alarm:#e23a4c;
  --safe:#3fbf6a;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --body:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:dark;
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--field);color:var(--paper);font-family:var(--body);overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}

#app{position:relative;width:100%;height:100%;overflow:hidden;background:#e2bb80}
#cv{position:absolute;inset:0;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}

.c{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.12em;margin-right:.3em;background:radial-gradient(circle at 35% 30%,#fff1a6,#f2b705 55%,#c98d00);box-shadow:inset 0 0 0 2px #a87400}

/* ---------- in-run HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none}
.topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:12px 56px 0 12px}
.chip{background:rgba(28,26,22,.8);color:var(--paper);border-radius:999px;padding:6px 12px;font-size:15px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.stage{font-family:var(--display);letter-spacing:.02em}
.chip.stage small{font-family:var(--body);font-size:12px;color:var(--hazard);margin-left:5px;letter-spacing:0}
.track{flex:1;min-width:0;height:12px;border-radius:7px;background:rgba(28,26,22,.6);position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(28,26,22,.6)}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(-45deg,var(--hazard) 0 6px,#ffd75a 6px 12px);border-radius:7px}
.kills{position:absolute;left:50%;top:48px;transform:translateX(-50%);font-family:var(--display);font-size:14px;background:rgba(28,26,22,.7);border-radius:999px;padding:4px 12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kills b{color:var(--hazard);font-weight:400;margin-left:6px}
.bossbar{position:absolute;left:12px;right:12px;top:50px;background:rgba(28,26,22,.85);border-radius:12px;padding:7px 10px 9px}
.bb-name{font-family:var(--display);font-size:15px;letter-spacing:.03em;color:#ffb3bb;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.bb-name em{font-style:normal;color:var(--hazard)}
.bb-track{position:relative;height:12px;border-radius:6px;background:#3a1f24;overflow:hidden}
.bb-track i{display:block;height:100%;width:100%;background:linear-gradient(#ff5b6c,var(--alarm));transition:width .12s linear}
.bb-track i.shield{background:linear-gradient(#8fd8ff,#3a8fd8)}
.bb-track s{position:absolute;top:0;bottom:0;width:2px;background:rgba(251,243,226,.85)}
.bb-enr{margin-top:6px;font-size:13px;color:var(--hazard);text-align:center}
.weap{position:absolute;left:12px;bottom:12px;font-size:13px;background:rgba(28,26,22,.78);border-radius:999px;padding:6px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.weap b{font-family:var(--display);font-weight:400;font-size:14px;margin-right:4px}
.weap span{color:var(--hazard)}
.assist{position:absolute;right:12px;bottom:46px;font-size:13px;background:rgba(45,99,240,.9);border-radius:999px;padding:6px 11px;white-space:nowrap}
.hint{position:absolute;left:16px;right:16px;top:max(232px,28%);margin:0 auto;width:fit-content;text-align:center;background:rgba(28,26,22,.85);padding:10px 16px;border-radius:14px;font-size:17px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;transition:opacity .5s}
.hint small{display:block;font-size:13px;color:var(--paper-2)}
.hint.gone{opacity:0}
.banner{position:absolute;left:0;right:0;top:max(170px,20%);display:flex;justify-content:center;padding:0 12px}
.banner span{display:inline-block;max-width:100%;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--display);font-size:24px;line-height:1.15;color:var(--ink);text-align:center;padding:10px 30px 8px;border-radius:8px;
  background:linear-gradient(90deg,transparent 0 14px,var(--hazard) 14px calc(100% - 14px),transparent calc(100% - 14px)),repeating-linear-gradient(-45deg,var(--ink) 0 6px,var(--hazard) 6px 12px);
  box-shadow:inset 0 0 0 3px var(--ink),0 6px 0 rgba(0,0,0,.25);animation:pop .28s cubic-bezier(.2,1.5,.4,1)}
.banner small{display:block;font-family:var(--body);font-size:13px;margin-top:3px}
.callout{position:absolute;left:0;right:0;top:138px;text-align:center;font-family:var(--display);font-size:30px;color:#fff;
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 5px 0 var(--alarm);animation:pop .22s cubic-bezier(.2,1.5,.4,1)}
.cap{position:absolute;left:0;right:0;top:max(176px,21%);text-align:center;pointer-events:none;animation:capIn .35s cubic-bezier(.2,1.5,.4,1)}
.cap b{display:block;white-space:nowrap;font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,52px);line-height:1;color:#fff;letter-spacing:.02em;
  text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),0 7px 0 #2d63f0}
.cap span{display:inline-block;margin-top:6px;font-family:var(--display);font-size:18px;color:var(--hazard);text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.cap.red b{text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),0 7px 0 var(--alarm)}
@keyframes capIn{from{transform:scale(1.4);opacity:0}}
.lanes{position:absolute;left:10px;right:10px;top:84px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;transition:opacity .35s,transform .35s}
.lanes div{background:rgba(28,26,22,.86);border-radius:10px;padding:6px 4px 5px;text-align:center;font-size:12px;line-height:1.25;border:2px solid transparent;min-width:0}
.lanes b{display:block;font-family:var(--display);font-weight:400;font-size:15px;word-break:keep-all;overflow-wrap:anywhere}
.lanes .l-stream{border-color:#34aaff}
.lanes .l-nest{border-color:var(--alarm)}
.lanes .l-reward{border-color:var(--hazard)}
.lanes.gone{opacity:0;transform:translateY(-10px)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.iconbtn{position:absolute;top:8px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(28,26,22,.8);display:grid;place-items:center;z-index:5}
.iconbtn svg{width:20px;height:20px}

/* ---------- briefing (menu) ---------- */
.menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;background:linear-gradient(180deg,rgba(21,19,15,.62) 0,rgba(21,19,15,.1) 34%,rgba(21,19,15,0) 46%,rgba(21,19,15,.55) 100%)}
.brand{padding:46px 22px 0;position:relative}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.32em;color:var(--hazard)}
.brand h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(58px,20vw,96px);line-height:.92;color:var(--paper);text-wrap:balance;text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 8px 0 var(--ink)}
.stamp{display:inline-block;margin-top:12px;transform:rotate(-5deg);border:3px solid var(--alarm);color:var(--alarm);background:rgba(251,243,226,.92);padding:5px 12px 4px;border-radius:6px;font-family:var(--display);font-size:20px;letter-spacing:.04em}
.stamp small{font-family:var(--body);font-size:13px;color:var(--ink);letter-spacing:0;margin-left:8px}
.brief{margin-top:10px;font-size:14px;color:var(--paper);text-shadow:0 1px 0 var(--ink);max-width:30ch;line-height:1.35}
.toast{margin-top:8px;display:inline-block;background:var(--cobalt);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
.sheet{background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 0 rgba(28,26,22,.35)}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.04em}
.wallet{font-size:18px;font-variant-numeric:tabular-nums}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.up{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--paper-2);padding:7px 9px 6px;color:var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .08s;min-width:0}
.up:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.up[aria-disabled="true"]{opacity:.55;box-shadow:none}
.up-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.up-name{font-family:var(--display);font-size:15px}
.up-lv{font-size:12px;color:var(--muted)}
.up-eff{font-size:12px;color:#5a4f3c;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-cost{font-size:14px;font-variant-numeric:tabular-nums}
.up.no{animation:no .3s}
@keyframes no{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.power{border:2px dashed var(--muted);border-radius:12px;padding:7px 9px 6px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5a4f3c;min-width:0}
.power b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--ink)}
.pbar{height:8px;border-radius:4px;background:#dccfae;overflow:hidden}
.pbar i{display:block;height:100%;width:50%;border-radius:4px;background:var(--safe)}
.power .warn{color:var(--alarm)}
.power .pity{color:var(--cobalt)}
.go{width:100%;border:0;border-radius:14px;padding:13px 10px 11px;font-family:var(--display);font-size:29px;letter-spacing:.12em;color:var(--ink);
  background:linear-gradient(90deg,transparent 0 22px,var(--hazard) 22px calc(100% - 22px),transparent calc(100% - 22px)),repeating-linear-gradient(-45deg,var(--ink) 0 7px,var(--hazard) 7px 14px);
  box-shadow:0 5px 0 var(--hazard-deep),inset 0 0 0 3px var(--ink);transition:transform .08s}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--hazard-deep),inset 0 0 0 3px var(--ink)}
.keys{font-size:12px;color:var(--muted);text-align:center}

/* ---------- debrief (result) ---------- */
.brand,.sheet{flex-shrink:0}
.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:16px;overflow-y:auto;background:rgba(21,19,15,.55)}
.rcard{margin:auto 0;flex-shrink:0;width:100%;max-width:350px;background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-30px) scale(.92);opacity:0}}
.r-eyebrow{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.rcard h2{margin:0;font-family:var(--display);font-weight:400;font-size:42px;line-height:1}
.rcard h2.win{color:var(--cobalt)}
.rcard h2.lose{color:var(--alarm)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}
.rstats div{background:var(--paper-2);border-radius:10px;padding:7px 4px;text-align:center;min-width:0}
.rstats dt{font-size:12px;color:var(--muted)}
.rstats dd{margin:2px 0 0;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.rrow span{background:var(--paper-2);border-radius:999px;padding:4px 10px}
.rtip{font-size:14px;color:#5a4f3c;margin:0;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.ghost{border:2px solid var(--ink);background:transparent;border-radius:12px;padding:10px;font-size:17px;color:var(--ink)}

@media (max-height:700px){.brand{padding-top:30px}.brand h1{font-size:clamp(48px,16vw,72px)}.brief{display:none}.up-eff{font-size:11px}}
@media (max-height:520px){.brand h1,.toast,.keys{display:none}.brand{padding-top:12px}}
@media (prefers-reduced-motion:reduce){.rcard,.banner span,.callout,.cap{animation:none}.up.no{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="탑로드 게임 화면"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="topbar">
      <div class="chip stage" id="hStage">작전 1</div>
      <div class="track"><i id="hFill"></i></div>
      <div class="chip"><span class="c"></span><span id="hCoins">0</span></div>
    </div>
    <div class="kills" id="hKills">처치 0</div>
    <div class="bossbar" id="hBoss" hidden>
      <div class="bb-name"><span id="hBossName">도살자</span><em id="hBossHp">0</em></div>
      <div class="bb-track" id="hBossTrack"><i id="hBossFill"></i></div>
      <div class="bb-enr" id="hEnr" hidden></div>
    </div>
    <div class="lanes gone" id="hLanes"><div class="l-stream"></div><div class="l-nest"></div><div class="l-reward"></div></div>
    <div class="callout" id="hSkill" hidden></div>
    <div class="cap" id="hCap" hidden><b></b><span></span></div>
    <div class="banner" id="hBanner" hidden><span></span></div>
    <div class="weap" id="hWeap"></div>
    <div class="assist" id="hAssist" hidden></div>
    <div class="hint gone" id="hHint"></div>
  </div>

  <div class="menu" id="menu">
    <div class="brand">
      <div class="eyebrow">TOP ROAD</div>
      <h1>탑로드</h1>
      <div class="stamp">작전 <span id="mStage">1</span><small id="mTier"></small><small>최고 <span id="mBest">0</span></small></div>
      <div class="brief" id="mBrief"></div>
      <div class="toast" id="mToast" hidden></div>
    </div>
    <div class="sheet">
      <div class="sheet-head"><h2>출격 전 정비</h2><span class="wallet"><span class="c"></span><b id="mCoins">0</b></span></div>
      <div class="ups" id="ups"></div>
      <button class="go" id="goBtn" type="button">출격</button>
      <div class="keys">드래그 또는 ← → 키로 분대를 움직여요</div>
    </div>
  </div>

  <div class="result" id="result" hidden>
    <div class="rcard" role="dialog" aria-labelledby="rTitle">
      <div class="r-eyebrow" id="rEyebrow">작전 1</div>
      <h2 id="rTitle">작전 성공</h2>
      <dl class="rstats">
        <div><dt>남은 병력</dt><dd id="rMen">0</dd></div>
        <div><dt>처치</dt><dd id="rKills">0</dd></div>
        <div><dt>획득 코인</dt><dd id="rCoins">+0</dd></div>
      </dl>
      <div class="rrow" id="rRow"></div>
      <p class="rtip" id="rTip"></p>
      <button class="go" id="rNext" type="button">다음 작전</button>
      <button class="ghost" id="rMenu" type="button">정비하러 가기</button>
    </div>
  </div>

  <button class="iconbtn" id="muteBtn" type="button" aria-label="소리 끄기"></button>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const app = $('app'), cv = $('cv');
let ctx = cv.getContext('2d');   // swapped briefly while baking sprites
const TAU = Math.PI * 2;
const DISPLAY = '"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const BODY = '"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 0 → 1 ramp over stages
const ramp = (n, k) => 1 - Math.exp(-(n - 1) / k);

// Korean big-number units: 1,658 · 1.16만 · 2,070만 · 1.5억 · 4.6조
const UNITS = [[1e20, '해'], [1e16, '경'], [1e12, '조'], [1e8, '억'], [1e4, '만']];
function fmt(v) {
  v = Math.round(v);
  const a = Math.abs(v);
  if (a < 1e4) return v.toLocaleString('en-US');
  if (a >= 1e24) return v.toExponential(1);
  for (const [u, name] of UNITS) {
    if (a < u) continue;
    const q = v / u, aq = Math.abs(q);
    if (aq < 10) return parseFloat(q.toFixed(2)) + name;
    if (aq < 100) return parseFloat(q.toFixed(1)) + name;
    return Math.round(q).toLocaleString('en-US') + name;
  }
  return String(v);
}
const fmtX = v => v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : fmt(v);
// reward numbers read like the ads: 65, 130, 199, 999
function pretty(v) {
  if (!(v > 0)) return 1;
  if (v < 20) return Math.max(1, Math.round(v));
  if (v < 100) { const r = Math.round(v / 5) * 5; return r >= 100 ? 99 : r; }
  const p = Math.pow(10, Math.floor(Math.log10(v)) - 1);
  const r = Math.round(v / p) * p;
  const k = Math.pow(10, Math.floor(Math.log10(r)));
  for (const a of [1, 2, 3, 5, 10]) {
    const A = a * k;
    if (A >= 100 && Math.abs(r - A) / A <= 0.06) return A - 1;
  }
  return r;
}

// ---------- balance knobs (the bot can tweak these through __toproad.K) ----------
const K = {
  C_A: 40, C_B: 14, C_Q: 0.12,
  START_BASE: 6, START_STEP: 2, START_F0: 0.12, START_FL: 0.008, START_CAP: 0.35, EN_RAMP: 0.85,
  EW_STEP: 0.22, EW_CAP: 2.2, VIS_BASE: 42, VIS_PER: 0.2, VIS_MAX: 72,
  BTK0: 1.5, BTK_SPAN: 3.0, BTK_K: 25,
  SIG0: 0.25, SIG_SPAN: 0.33, SIG_CAP: 0.60, WIN: 4.5, SLOT_FIRST: 0.5, SLOT_FINAL: 1.2, WAVE_MAX: 60,
  KAP0: 0.18, KAP_SPAN: 0.12, KAP_HARD: 0.35, NEST_HP_MUL: 0.8, NEST_PULSE: 1.5, NEST_GAP: 34,
  DDA_EXP: 0.3, DDA_MIN: 0.8, DDA_MAX: 1.3,
  HORDE_SHARE: 0.3, HORDE_MIN: 24, HORDE_MAX: 60, ALIVE_CAP: 75, TUT_NEST: 0.5, TUT_VAULT: 0.6,
  TAU: { vault: 1.6, crate: 1.3, nest: 2.2, drum: 1.0, wdrum: 1.1, elite: 6, pylon: 0.9 },
  VAULT_X2: 1.4, JACKPOT: 1.25, GATE_STEP: 0.06, WALL_STEP: 0.06, CHARGE_STEP: 0.25,
  STREAM_SHARE: 0.30, STREAM_MAXTOK: 60, TOK_VZ: -3, TOK_AHEAD: 45,
  VAULT_MEN: 0.35, VAULT_MEN_ADD: 5, NU_TARGET: 1.1, NU_MIN: 0.5, NU_MAX: 1.8,
  GATE_GOOD: [0.22, 0.34], GATE_WEAK: [0.08, 0.14], GATE_NEG: [0.10, 0.18], HORDE_GOOD: 0.30, HORDE_WEAK: 0.12,

function merge(d) {

  if (d.seen && typeof d.seen === 'object') for (const k in d.seen) save.seen[k] = 1;
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { merge(JSON.parse(raw)); return; }
    const old = localStorage.getItem(OLD_KEY);
    if (old) migrate(JSON.parse(old));

}

// v1 used linear upgrades; convert levels to the same multiplier, then top the squad up to the v2 curve
function migrate(o) {
  if (!o || typeof o !== 'object') return;
  for (const k of ['stage', 'best', 'coins']) if (Number.isFinite(o[k])) save[k] = Math.max(k === 'stage' ? 1 : 0, Math.floor(o[k]));
  if (typeof o.mute === 'boolean') save.mute = o.mute;
  const u = o.up || {};
  const L = k => Math.max(0, Math.floor(u[k] || 0));
  save.up.dmg = Math.round(Math.log(1 + 0.25 * L('dmg')) / Math.log(1.08));
  save.up.rate = Math.round(Math.log(1 + 0.15 * L('rate')) / Math.log(1.04));
  save.up.men = Math.min(40, L('men'));
  save.up.coin = Math.min(20, 2 * L('coin'));
  const want = 0.85 * refEM(save.stage);
  let grant = 0;
  const v = { dmg: save.up.dmg, rate: save.up.rate };
  for (let guard = 0; guard < 400 && Math.pow(1.08, v.dmg) * Math.pow(1.04, v.rate) < want; guard++) {
    const cd = UPS.dmg.cost(v.dmg), cr = UPS.rate.cost(v.rate);
    if (cd <= cr) { grant += cd; v.dmg++; } else { grant += cr; v.rate++; }
  }
  grant = Math.round(grant);
  if (grant > 0) { save.coins += grant; migrateToast = `v2 보급품 지급: 코인 ${fmt(grant)}`; }
  persist();
}

// ---------- difficulty curves ----------
// everything is "seconds of the expected player's fire": E(n,s) = 2 · expected count · expected upgrades · expected weapon
const Cn = n => K.C_A + K.C_B * (n - 1) + K.C_Q * (n - 1) * (n - 1);
function startMen(n, L) {
  const C = Cn(n);
  return Math.max(1, Math.round(Math.min(K.START_CAP * C, Math.max(K.START_BASE + K.START_STEP * L, C * (K.START_F0 + K.START_FL * L)))));
}
const vis = N => Math.min(2 * N, K.VIS_BASE + K.VIS_PER * Math.min(N, 150), K.VIS_MAX);
const BTK = n => K.BTK0 + K.BTK_SPAN * ramp(n, K.BTK_K);
const Zf = n => K.ZTAB[n % 10];
const creep = n => 1 + K.CREEP * Math.max(0, n - K.CREEP_FROM);
const sigma = n => Math.min(K.SIG_CAP, K.SIG0 + K.SIG_SPAN * ramp(n, 15));
const kappa = n => K.KAP0 + K.KAP_SPAN * ramp(n, 15);
const Tb = n => K.TB0 + K.TB_SPAN * ramp(n, K.TB_K);
const gcf = n => Math.pow(K.COIN_G, n - 1);
const tierOf = n => n % 10 === 0 ? 'war' : n % 10 === 5 ? 'big' : 'normal';
const stageMul = n => tierOf(n) === 'war' ? 2 : tierOf(n) === 'big' ? 1.5 : 1;
// even stages (except big/warlord ones) end on a castle bridge against a counted red army; the rest end with a zombie boss
const stageKind = n => n === 2 || (n > 2 && n % 2 === 0 && n % 10 !== 0) ? 'army' : 'boss';
const themeOf = n => stageKind(n) === 'army' ? 'castle' : 'desert';

// reference spender: what a typical player has bought by stage n (EM = expected upgrade multiplier)
const REF = { EM: [1, 1], LM: [0, 0], coins: 0, L: { men: 0, dmg: 0, rate: 0, coin: 0, armor: 0 } };
function refExtend(n) {
  while (REF.EM.length <= n) {
    const m = REF.EM.length - 1;       // income of stage m, then record the start of stage m+1
    const L = REF.L, cm = 1 + 0.1 * L.coin, gc = gcf(m), kills = 40 + 3 * Math.min(m, 40);
    const win = cm * gc * (K.COIN_BASE + K.COIN_N * m + K.COIN_KILL * Math.min(kills, 400) + K.COIN_VAULT + K.COIN_NEST * 0.5 + 0.5 * 5) * stageMul(m);
    const loss = cm * gc * ((K.COIN_BASE + K.COIN_N * m) * (K.LOSS_BASE + K.LOSS_PROG * 0.6) + K.COIN_KILL * Math.min(kills, 400));
    REF.coins += win + 0.3 * loss;
    for (let guard = 0; guard < 200; guard++) {
      const cd = UPS.dmg.cost(L.dmg), cr = UPS.rate.cost(L.rate);
      const cheap = Math.min(cd, cr);
      const cc = UPS.coin.cost(L.coin), cmn = UPS.men.cost(L.men), ca = UPS.armor.cost(L.armor);
      if (L.coin < 20 && cc <= 2 * cheap && REF.coins >= cc) { REF.coins -= cc; L.coin++; continue; }
      if (L.men < 40 && cmn <= 0.6 * cheap && REF.coins >= cmn) { REF.coins -= cmn; L.men++; continue; }
      if (m + 1 >= 5 && L.armor < 10 && ca <= 0.4 * cheap && REF.coins >= ca) { REF.coins -= ca; L.armor++; continue; }
      if (REF.coins >= cheap) { REF.coins -= cheap; if (cd <= cr) L.dmg++; else L.rate++; continue; }
      break;
    }
    REF.EM.push(metaOf(L));
    REF.LM.push(L.men);
  }
}
const refEM = n => { refExtend(n); return REF.EM[n]; };
const refLM = n => { refExtend(n); return REF.LM[n]; };

// per-stage power model; s is the position along the stage (0..1), the boss sits at s = 1
function makeModel(n) {
  const C = Cn(n), ec0 = startMen(n, refLM(n)), EM = refEM(n);
  const M = { n, C, ec0, EM, ew: [] };
  M.EN = s => ec0 + (C - ec0) * Math.min(1, s / K.EN_RAMP);
  M.EW = s => { let f = 1; for (const [ws, add] of M.ew) if (ws <= s) f += add; return Math.min(K.EW_CAP, f); };
  M.E = s => 2 * M.EN(s) * EM * M.EW(s);
  M.w = s => Math.max(1, BTK(n) * M.E(s) / vis(M.EN(s)) * Zf(n) * creep(n));
  M.hp = (s, tau) => Math.max(1, M.E(s) * tau * Zf(n) * creep(n));
  return M;
}

// ---------- main update ----------
function update(dt) {
  const g = G;
  g.t += dt;
  if (keys.l) g.tx -= K.KEY_SPEED * dt;
  if (keys.r) g.tx += K.KEY_SPEED * dt;
  g.tx = clamp(g.tx, -K.TX_LIM, K.TX_LIM);
  const px = g.x;
  g.x += (g.tx - g.x) * Math.min(1, dt * 14);
  g.vx = dt > 0 ? (g.x - px) / dt : 0;
  g.lane = laneOf(g.x, g.lane);
  g.dims = squadDims(g.count);
  const fighting = g.phase === 'run' || g.phase === 'boss' || g.phase === 'clash';

  if (g.phase === 'run' && !g.halt) {
    g.dist += SPEED * dt;
    if (g.dist >= g.len) { g.dist = g.len; startArena(); }
  }
  camZ = g.dist - CAM_BACK;

  if (g.phase === 'run') while (g.evI < g.events.length && g.dist >= g.events[g.evI].z) runEvent(g.events[g.evI++]);
  for (const gt of g.gates) {
    if (gt.passed) continue;
    if (!save.seen.redgate && gt.kind !== 'wall' && gt.z - g.dist < 30 && gt.panels.some(p => p.op === '+' && p.v < 0)) showHint('redgate', '빨간 게이트도 쏘면 숫자가 올라가요');
    if (g.dist < gt.z) break;

  }
  if (g.buff.dodgeT > 0) g.buff.dodgeT -= dt;
  if (fighting && g.count > 0) fireWeapon(dt);
  updateBullets(dt);

  else if (g.tokens.length) g.tokens.length = 0;
  updateZombies(dt);
  updateObjs(dt);
  updateZones(dt);
  if (g.phase === 'boss') updateBoss(dt);
  else if (g.phase === 'clash') updateClash(dt);
  for (const gt of g.gates) for (const p of gt.panels) if (p.flash > 0) p.flash -= dt;

  if (g.lostAcc > 0 && g.t - g.lostT > 0.25) {

  g.punch = Math.max(0, g.punch - dt * 2.5);

  const g = G;

const LOSS_TIP = {

  clash: n => `적군과 부딪혀 ${fmt(n)}명 잃었어요. 적 분대는 쏘거나 피해 가고, 마지막 돌격 전에 인원을 늘리세요.`,

  if (win) {
    coins = cm * gc * (K.COIN_BASE + K.COIN_N * n + K.COIN_KILL * kills + K.COIN_VAULT * g.stats.vaults + K.COIN_NEST * g.stats.nests + 0.5 * g.stats.dodges) * stageMul(n);

    save.best = Math.max(save.best, n);
    delete save.fails[n];

  save.coins += coins;

// ---------- objects ----------

  else if (o.type === 'drum' || o.type === 'wdrum') drawDrum(o, p);
  else if (o.type === 'barrel') drawBarrel(o, p);
  else if (o.type === 'sandbag') drawWallBags(o);
  else if (o.type === 'saw') drawSaw(o, t);

}

function drawEntities(t) {
  const g = G;
  const list = [];
  const inView = z => z - camZ > 0.6 && z - camZ < FAR;
  for (const gt of g.gates) if (inView(gt.z)) list.push({ z: gt.z, k: 0, o: gt });
  for (const zb of g.zombies) if (!zb.dead && inView(zb.z)) list.push({ z: zb.z, k: 1, o: zb });
  for (const o of g.objs) if (!o.dead && inView(o.z)) list.push({ z: o.z, k: 2, o });
  for (const tk of g.tokens) if (inView(tk.z)) list.push({ z: tk.z, k: 5, o: tk });
  if (g.boss && g.boss.hp > 0 && inView(g.boss.z)) list.push({ z: g.boss.z, k: 3, o: g.boss });
  if (g.army && g.army.count > 0 && inView(g.army.z)) list.push({ z: g.army.z, k: 6, o: g.army });
  list.push({ z: g.dist + 0.01, k: 4 });
  list.sort((a, b) => b.z - a.z);
  for (const e of list) {
    if (e.k === 0) drawGate(e.o);
    else if (e.k === 4) drawSquad(t);
    else if (e.k === 5) drawToken(e.o);
    else if (e.k === 6) drawArmy(e.o, t);
    else {
      const p = P(e.o.x, 0, e.z);
      if (!p) continue;
      if (e.k === 1) drawZombie(e.o, p, t);

}

function drawBullets() {

function render() {

const castleOn = () => G && G.theme === 'castle';
function drawSkyCastle() {

function drawGroundCastle() {
  const g = G;
  const zn = camZ + 0.6, zf = camZ + FAR;
  // sea everywhere, then the stone causeway and a broad rampart on the right
  ctx.fillStyle = seaGrad;
  ctx.fillRect(-30, HOR, W + 60, H - HOR + 30);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineCap = 'round';
  const WV = 4;
  for (let k = Math.floor(zn / WV); k * WV < zf; k++) {
    for (let j = 0; j < 3; j++) {
      const h = hash(k * 3 + j, -1), z = k * WV + (h % 400) / 100;
      const x = -ROAD - 1.4 - ((h >>> 9) % 1000) / 1000 * 9;
      const a = P(x, 0, z), b = P(x - 0.9, 0, z);
      if (!a || !b || a.dz > 60) continue;
      ctx.lineWidth = Math.max(1, a.s * 0.06);
      const w = Math.sin(g.t * 2 + k + j) * a.s * 0.15;
      ctx.beginPath(); ctx.moveTo(a.x + w, a.y); ctx.lineTo(b.x + w, b.y); ctx.stroke();
    }
  }
  ctx.fillStyle = '#7f8a74';
  quad(P(ROAD + 0.5, 0, zn), P(ROAD + 30, 0, zn), P(ROAD + 30, 0, zf), P(ROAD + 0.5, 0, zf)); ctx.fill();
  ctx.fillStyle = '#7a8170';
  const L = 2.5;
  for (let k = Math.floor(zn / L); k * L < zf; k++) {
    if (k & 1) continue;
    const z0 = Math.max(k * L, zn), z1 = Math.min((k + 1) * L, zf);
    quad(P(ROAD + 0.5, 0, z0), P(ROAD + 30, 0, z0), P(ROAD + 30, 0, z1), P(ROAD + 0.5, 0, z1)); ctx.fill();
  }
  // causeway slabs
  ctx.fillStyle = '#8d8a84';
  quad(P(-ROAD - 0.5, 0, zn), P(ROAD + 0.5, 0, zn), P(ROAD + 0.5, 0, zf), P(-ROAD - 0.5, 0, zf)); ctx.fill();
  for (let k = Math.floor(zn / L); k * L < zf; k++) {
    const z0 = Math.max(k * L, zn), z1 = Math.min((k + 1) * L, zf);
    for (let c = 0; c < 3; c++) {
      if (((k + c) & 1) === 0) continue;
      ctx.fillStyle = '#a29f98';
      quad(P(-ROAD + c * 2, 0, z0), P(-ROAD + c * 2 + 2, 0, z0), P(-ROAD + c * 2 + 2, 0, z1), P(-ROAD + c * 2, 0, z1)); ctx.fill();
    }
  }
  ctx.strokeStyle = 'rgba(60,56,50,.35)'; ctx.lineWidth = 1;
  for (let k = Math.floor(zn / L); k * L < zf; k++) {
    const a = P(-ROAD, 0, Math.max(k * L, zn)), b = P(ROAD, 0, Math.max(k * L, zn));
    if (!a || !b || a.dz > 70) continue;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const lx of [-1, 1]) {
    const a = P(lx, 0, zn), b = P(lx, 0, zf);

  }
}
// battlements on both sides: merlons every 1.2 m, drawn far to near
function drawParapets() {

  return stageKind(n) === 'army' ? (t ? t + ' · 결전' : '결전') : t;
};
// big outlined ad-style caption in the middle of the screen
function caption(text, sub, red, dur = 1.6) {
  const c = $('hCap');
  c.firstChild.textContent = text;
  c.firstChild.style.fontSize = text.length > 9 ? 'clamp(26px, 8.6vw, 44px)' : '';
  c.lastChild.textContent = sub || '';
  c.lastChild.hidden = !sub;
  c.classList.toggle('red', !!red);
  c.hidden = false;
  $('hBanner').hidden = true; banner.q = null; banner.pri = 0;
  $('hSkill').hidden = true;
  c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
  clearTimeout(caption.t);
  caption.t = setTimeout(() => { c.hidden = true; }, dur * 1000);
}
function buildUps() {
  const box = $('ups');
  for (const k of UKEYS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'up'; b.id = 'up-' + k; b.dataset.k = k;
    b.innerHTML = `<span class="up-top"><span class="up-name">${UPS[k].name}</span><span class="up-lv"></span></span><span class="up-eff"></span><span class="up-cost"><span class="c"></span><b></b></span>`;
    box.appendChild(b);
    upButtons[k] = b;
  }
  const pc = document.createElement('div');
  pc.className = 'power';
  pc.innerHTML = '<span>권장 <b id="pwRec">0</b></span><span>내 전투력 <b id="pwMine">0</b></span><div class="pbar"><i id="pwBar"></i></div><span id="pwNote"></span><span class="pity" id="pwPity"></span>';
  box.appendChild(pc);
  box.addEventListener('click', e => {
    const b = e.target.closest('.up');
    if (b) buy(b.dataset.k, b);
  });
}
function powerRead() {
  const n = save.stage, k = save.fails[n] || 0;
  const M = G && G.stage === n ? G.M : makeModel(n);
  const rec = M.E(1) * Zf(n);
  const mine = 2 * M.C * metaOf(save.up) * M.EW(1) * (1 + K.PITY_DPS * k);
  return { rec, mine, k };
}
function renderMenu() {
  const n = save.stage;
  $('mStage').textContent = n;
  $('mBest').textContent = save.best;
  $('mTier').textContent = tierTag(n) ? '· ' + tierTag(n) : '';
  $('mCoins').textContent = fmt(save.coins);
  const intros = Object.keys(SEGDEF).filter(k => k !== 'wave' && k !== 'split' && SEGDEF[k].intro <= n && !save.seen['seg_' + k]);
  const armyN = stageKind(n) === 'army' ? (G && G.stage === n && G.army ? G.army.max : pretty(K.ARMY_RATIO * makeModel(n).C)) : 0;
  $('mBrief').textContent = (armyN ? `결전: 적군 ${fmt(armyN)} · ${ARCH.giant.name}` : `보스: ${ARCH[bossFor(n)].name}`) + (intros.length ? ` · 새 기믹: ${intros.map(k => SEGNAME[k]).join(', ')}` : n === 2 ? ' · 무기 상자 등장' : '');
  for (const k of UKEYS) {
    const b = upButtons[k], u = UPS[k], lv = save.up[k];
    const locked = u.unlock && n < u.unlock, maxed = lv >= u.max;
    const cost = upCost(k);
    b.querySelector('.up-lv').textContent = locked ? `작전 ${u.unlock}부터` : maxed ? 'MAX' : 'Lv ' + lv;
    b.querySelector('.up-eff').textContent = maxed ? `${u.label} ${u.val(lv)}` : `${u.label} ${u.val(lv)} → ${u.val(lv + 1)}`;
    b.querySelector('.up-cost b').textContent = locked || maxed ? '—' : fmt(cost);
    b.setAttribute('aria-disabled', String(locked || maxed || save.coins < cost));
  }
  const pw = powerRead();
  const ratio = pw.mine / pw.rec;
  $('pwRec').textContent = fmt(pw.rec);
  $('pwMine').textContent = fmt(pw.mine);
  const bar = $('pwBar');
  bar.style.width = Math.min(100, ratio * 70) + '%';
  bar.style.background = ratio >= 1 ? 'var(--safe)' : ratio >= 0.85 ? 'var(--hazard)' : 'var(--alarm)';
  const note = $('pwNote');
  note.className = ratio < 0.85 ? 'warn' : '';
  note.textContent = ratio < 0.85 ? '정비 추천' : ratio >= 1 ? '출격 준비 완료' : '조금 빠듯해요';
  $('pwPity').textContent = pw.k ? `지원 사격 +${Math.round(K.PITY_DPS * 100 * pw.k)}%` : '';
  const t = $('mToast');
  if (migrateToast) { t.textContent = migrateToast; t.hidden = false; } else t.hidden = true;
}
function buy(k, el) {
  audioOn();
  const u = UPS[k];
  const cost = upCost(k);
  if ((u.unlock && save.stage < u.unlock) || save.up[k] >= u.max || save.coins < cost) {
    el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
    return;
  }
  save.coins -= cost;
  save.up[k]++;
  migrateToast = '';
  persist();
  sfx('buy');
  renderMenu();
  if (k === 'men' && mode === 'menu') { G.count = G.shown = startMen(save.stage, save.up.men); G.dims = squadDims(G.count); }
}

function showMenu() {
  mode = 'menu';
  G = newRun(save.stage);
  G.pop.fill(-10);
  camZ = -CAM_BACK; camX = 0;
  hud.hidden = true; result.hidden = true; menu.hidden = false;
  $('hCap').hidden = true;
  renderMenu();
}
function startPlay() {
  audioOn();
  mode = 'play';
  G = newRun(save.stage);
  hud.hidden = false; menu.hidden = true; result.hidden = true;
  const n = G.stage, tag = tierTag(n);
  const st = $('hStage');
  st.textContent = '작전 ' + n;
  if (tag) { const s = document.createElement('small'); s.textContent = tag; st.appendChild(s); }
  $('hBoss').hidden = true;
  $('hSkill').hidden = true;
  $('hBanner').hidden = true;
  banner.q = null; banner.pri = 0; showHint.key = null;
  hideLanes();
  for (const k in hudCache) delete hudCache[k];
  $('hCap').hidden = true;
  if (G.army) showHint(null, `작전 ${n} · 결전! 적군 ${fmt(G.army.max)}명`, '거인 장군을 쓰러뜨리면 전군 돌격');
  else showHint(null, n === 1 ? '좌우로 드래그해서 이동' : `작전 ${n} · 보스: ${ARCH[G.bossCfg.arch].name}`, n === 1 ? '게이트를 쏘면 숫자가 올라가요' : G.pity ? `지원 사격 +${Math.round(K.PITY_DPS * 100 * G.pity)}%` : '');
}
let lanesSeg = null, lanesObj = null;
function showLanes(seg, o) {
  lanesSeg = seg; lanesObj = o;
  const box = $('hLanes'), divs = box.children;
  const k = seg.k || 1;
  for (let l = 0; l < 3; l++) {
    const d = divs[l];
    d.textContent = '';
    const b = document.createElement('b'), s = document.createElement('span');
    if (l === seg.lanes.stream) { d.className = 'l-stream'; b.textContent = `+${fmt(k)} 계속`; s.textContent = '병력 줍기'; }
    else if (l === seg.lanes.nest) { d.className = 'l-nest'; b.textContent = castleOn() ? '적 병영' : '좀비 둥지'; s.textContent = '부수면 멈춤'; }
    else { d.className = 'l-reward'; b.textContent = rewardText(o); s.textContent = 'HP ' + fmt(o.hp); }
    d.append(b, s);
  }
  box.classList.remove('gone');
}
function hideLanes() { lanesSeg = lanesObj = null; $('hLanes').classList.add('gone'); }
function setupBossBar() {
  const bs = G.boss;
  if (!bs) return;
  $('hBoss').hidden = false;
  const nm = (G.army ? '적장 · ' : '') + bs.A.name + (TIER_NAME[bs.tier] ? ' · ' + TIER_NAME[bs.tier] : '');
  $('hBossName').textContent = nm; hudCache.hBossName = nm;
  const tr = $('hBossTrack');
  tr.querySelectorAll('s').forEach(e => e.remove());
  const marks = bs.tier === 'war' ? [0.66, 0.33] : G.stage >= 5 ? [0.5] : [];
  for (const m of marks) { const s = document.createElement('s'); s.style.left = (m * 100) + '%'; tr.appendChild(s); }
  $('hBossFill').className = bs.shield ? 'shield' : '';
}
function showResult(win, coins, prog) {
  const g = G, n = g.stage;
  $('rEyebrow').textContent = win ? `작전 ${n} 완료` : `작전 ${n} · ${Math.round(clamp(g.dist / g.len, 0, 1) * 100)}% 진행`;
  const title = $('rTitle');
  title.textContent = win ? '작전 성공' : '분대 전멸';
  title.className = win ? 'win' : 'lose';
  $('rMen').textContent = fmt(g.count);
  $('rKills').textContent = fmt(g.kills);
  $('rCoins').textContent = '+' + fmt(coins);
  const row = $('rRow');
  row.textContent = '';
  const chip = t => { const s = document.createElement('span'); s.textContent = t; row.appendChild(s); };
  if (g.stats.vaultsSeen) chip(`금고 ${g.stats.vaults}/${g.stats.vaultsSeen} 파괴`);
  if (g.stats.dodgeChances) chip(`회피 ${g.stats.dodges}/${g.stats.dodgeChances}`);
  chip(`${WEAPONS[g.weapon.id].name} ${stars(g.weapon.star)}`);
  let tip;
  if (win) tip = `다음은 작전 ${n + 1}${tierTag(n + 1) ? ' · ' + tierTag(n + 1) : ''}. ${stageKind(n + 1) === 'army' ? '성벽 끝에서 적군이 기다려요.' : '좀비가 조금 더 단단해져요.'}`;
  else if (g.clash && g.army && g.army.count > 0) {
    tip = `적군이 ${fmt(g.army.count)}명 더 많았어요. 돌격 전에 인원을 늘리고, 화력이 높을수록 번개 일제사격이 더 많이 쓰러뜨려요. 다음 도전엔 지원 사격 +${Math.round(K.PITY_DPS * 100 * (save.fails[n] || 1))}%`;
  } else {
    let worst = null, wn = 0;
    for (const [k, v] of Object.entries(g.stats.lossBy)) if (v > wn) { wn = v; worst = k; }
    tip = (worst && LOSS_TIP[worst] ? LOSS_TIP[worst](wn) : '정비에서 화력과 병력을 올려보세요.') + ` 다음 도전엔 지원 사격 +${Math.round(K.PITY_DPS * 100 * (save.fails[n] || 1))}%`;
  }
  $('rTip').textContent = win ? tip : themed(tip);
  $('rNext').textContent = win ? '다음 작전' : '다시 출격';
  $('hSkill').hidden = true;
  $('hBanner').hidden = true;
  $('hHint').classList.add('gone');
  hideLanes();
  result.hidden = false;
  setTimeout(() => $('rNext').focus({ preventScroll: true }), 50);
}

const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function updateHud() {
  if (mode !== 'play') return;
  const g = G;
  $('hFill').style.width = (clamp(g.dist / g.len, 0, 1) * 100).toFixed(1) + '%';
  setText('hCoins', fmt(save.coins + (g.done ? 0 : g.runCoins)));
  if (lanesObj && !lanesObj.dead) {
    const b = $('hLanes').querySelector('.l-reward b'), t = rewardText(lanesObj);
    if (b && b.textContent !== t) b.textContent = t;
  }
  const W = WEAPONS[g.weapon.id];
  setText('hWeap', `${W.name} ${stars(g.weapon.star)} · 화력 ×${fmtX(dmgMul() * W.dps * STAR[g.weapon.star] * g.buff.fire)}`);
  const kills = $('hKills');
  kills.hidden = !!g.boss;
  setText('hKills', `처치 ${fmt(g.kills)}`);
  setText('hAssist', g.pity ? `지원 사격 +${Math.round(K.PITY_DPS * 100 * g.pity)}%` : '');
  $('hAssist').hidden = !g.pity;
  const bs = g.boss, ar = g.army;
  if (g.clash && ar) {
    // after the general falls the bar tracks the red army
    setText('hBossName', '적군 · 돌격');
    $('hBossFill').style.width = (ar.count / ar.max * 100).toFixed(1) + '%';
    setText('hBossHp', fmt(ar.count));
    $('hEnr').hidden = true;
  } else if (bs) {
    $('hBossFill').style.width = (bs.hp / bs.max * 100).toFixed(1) + '%';
    setText('hBossHp', fmt(Math.ceil(bs.hp)));
    const enr = $('hEnr');
    if (bs.enraged) { enr.hidden = false; setText('hEnr', '광폭화!'); }
    else if (bs.enrWarn) { enr.hidden = false; setText('hEnr', `광폭화 ${Math.max(0, Math.ceil(K.ENR * bs.ttk - bs.fightT))}…`); }
    else enr.hidden = true;
  }
}

// ---------- input ----------
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (mode !== 'play') return;
  drag = { x: e.clientX, tx: G.tx };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!drag || mode !== 'play') return;
  G.tx = clamp(drag.tx + (e.clientX - drag.x) / (F / CAM_BACK) * 1.25, -K.TX_LIM, K.TX_LIM);
});
const endDrag = () => {
  // during boss fights and elite duels a release settles on the nearest lane centre
  if (drag && mode === 'play' && (G.phase === 'boss' || G.halt)) G.tx = LANES[laneOf(G.tx)];
  drag = null;
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
const isL = k => k === 'ArrowLeft' || k === 'a' || k === 'A';
const isR = k => k === 'ArrowRight' || k === 'd' || k === 'D';
addEventListener('keydown', e => {
  if (isL(e.key)) { keys.l = true; if (mode === 'play') e.preventDefault(); }
  if (isR(e.key)) { keys.r = true; if (mode === 'play') e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (isL(e.key)) keys.l = false;
  if (isR(e.key)) keys.r = false;
  if ((isL(e.key) || isR(e.key)) && mode === 'play' && (G.phase === 'boss' || G.halt) && !keys.l && !keys.r) G.tx = LANES[laneOf(G.tx)];
});
addEventListener('blur', () => { keys.l = keys.r = false; drag = null; });

$('goBtn').addEventListener('click', startPlay);
$('rNext').addEventListener('click', startPlay);
$('rMenu').addEventListener('click', showMenu);
$('muteBtn').addEventListener('click', () => { save.mute = !save.mute; persist(); paintMute(); audioOn(); });
addEventListener('resize', resize);

// ---------- loop ----------
let last = 0, qAcc = 0, qN = 0, qSlow = 0, qFast = 0, testHold = false;
function frame(ts) {
  const iv = ts - last;
  const real = Math.min(0.05, Math.max(0, iv / 1000));
  last = ts;
  // hitstop and slow motion stretch game time only
  let dt = real;
  const g = G;
  if (g.hs > 0) { g.hs -= real; dt *= 0.12; }
  else if (g.slow > 0) { g.slow -= real; dt *= 0.5; }
  else if (g.dslow > 0) { g.dslow -= real; dt *= 0.3; }
  if (testHold) {}
  else if (mode === 'play') update(dt);
  else { g.t += dt; updateFx(dt); }
  render();
  updateHud();
  if (iv > 0 && iv < 250) { qAcc += iv; qN++; }
  if (qAcc >= 500) {
    const avg = qAcc / qN; qAcc = 0; qN = 0;
    if (avg > 20) { qSlow += 0.5; qFast = 0; } else if (avg < 14) { qFast += 0.5; qSlow = 0; } else { qSlow = qFast = 0; }
    if (!QLOW && qSlow >= 2) { QLOW = true; QDRAW = 100; QPART = 300; }
    if (QLOW && qFast >= 6) { QLOW = false; QDRAW = MAXDRAW; QPART = K.PART_CAP; }
  }
  requestAnimationFrame(frame);
}

function start(data) {
  loadSave();
  if (data && data.save && data.save.v === 2) merge(data.save);
  try { window.claude?.hot?.snapshot?.(() => ({ save: JSON.parse(JSON.stringify(save)) })); } catch (e) {}
  buildUps();
  paintMute();
  resize();
  showMenu();
  const fonts = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load('40px "Black Han Sans"'), document.fonts.load('20px "Jua"')]).catch(() => {})
    : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 1500))]).then(() => {
    last = performance.now();
    requestAnimationFrame(frame);
  });
}

// lanes ranked by how soon a telegraph lands on them (bots and tests use this)
function safestLane() {
  const g = G;
  const soon = [Infinity, Infinity, Infinity];
  for (const z of g.zones) {
    if (z.done) continue;
    const at = z.kind === 'pool' ? g.t : z.tHit;
    for (let l = 0; l < 3; l++) if (z.mask & (1 << l)) soon[l] = Math.min(soon[l], at);
  }
  let best = g.lane;
  for (let l = 0; l < 3; l++) {
    if (soon[l] > soon[best] + 1e-6 || (soon[l] === soon[best] && Math.abs(l - g.lane) < Math.abs(best - g.lane))) best = l;
  }
  return { lane: best, soon };
}

// test hook: lets an automated run drive the simulation without a browser frame clock
window.__toproad = {
  get g() { return G; }, get mode() { return mode; }, save, K, update, startPlay, showMenu, genStage, newRun,
  refEM, refLM, Cn, makeModel, BTK, vis, Tb, Zf, fmt, pretty, laneOf, LANES, WEAPONS, SKILLS, ARCH, UPS, safestLane, squadDPS,
  setLevels(o) { Object.assign(save.up, o); },
  setSeedOffset(k) { K.SEED_OFF = k; },
  set hold(v) { testHold = v; },
};

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
